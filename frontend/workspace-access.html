<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Доступ к рабочему разделу — FraerApp</title>
  <link rel="stylesheet" href="/typography.css?v=1">
  <link rel="stylesheet" href="/story-workspace.css?v=1">
  <link rel="stylesheet" href="/site-controls.css?v=5">
  <script type="module" src="/site-controls.js?v=5"></script>
</head>
<body>
  <main class="workspace">
    <section class="workspace-detail">
      <h1 id="access-title">Проверяем доступ</h1>
      <p id="access-status" class="workspace-status" role="status" aria-live="polite">Восстанавливаем текущую сессию…</p>
      <div class="workspace-actions">
        <a id="access-home" class="workspace-button" href="/">На главную для входа</a>
        <a id="access-mine" class="workspace-button" href="/my-stories/" hidden>Мои истории</a>
      </div>
    </section>
  </main>
  <noscript>Для проверки текущей сессии включите JavaScript или вернитесь на главную для входа.</noscript>
  <script type="module" src="/workspace-access.js?v=1"></script>
</body>
</html>
